# Columbia River Gorge near the WFIP2 site (Wasco, Oregon): the river at
# about 50 m above sea level, the Columbia Hills to the north up to about
# 900 m, the plateau to the south at 300 m. columbia_gorge.py prepare
# fetches dem.asc (SRTM 1 arc-second, AWS Terrain Tiles) and writes the
# outer deck from this file with tools/make_gust_case.py.
case:
  name: gorge_outer
domain:
  center_lat_lon: [45.70, -120.80]
  half_width: [9600., 8000.]
  top: 3000.
terrain:
  file: dem.asc
  border:
    flat_width: 1000.
    slope_width: 2000.
    level: mean
mesh:
  cell_size: 200.
  first_layer: 10.
  stretch_ratio: 1.1
wind:
  speed: 8.
  height: 10.
  direction: 270.
surface:
  roughness: 0.05
output:
  checkpoint: true
