# column_target's set-up with the wind along y (from 0 degrees) and along x
# (from 270 degrees). The geostrophic wind turns with height, so a face parallel
# to the 10 m wind has flow through it aloft: the tool makes it an inflow or an
# outflow face, not a slip wall. check_case_setup.py: every 3-D cell's wind
# against the column's table.
case:
  name: column_axis
domain:
  half_width: 800.
  top: 2000.
mesh:
  cell_size: 100.
  layers: 32
  first_layer: 4.
wind:
  speed: 8.
  height: 10.
  directions: [0, 270]
  drive: geostrophic_column
atmosphere:
  latitude: 45.          # degrees north: the Coriolis parameter
surface:
  roughness: 0.03
solver:
  max_iterations: 400
