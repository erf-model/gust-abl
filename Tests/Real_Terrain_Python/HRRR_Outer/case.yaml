# HRRR as the outer level at the AWAKEN site (American WAKE experimeNt) north of Enid, Oklahoma: the day hour,
# 2023-05-10 20 UTC (cycle 19 UTC, forecast hour 1). prepare.py writes awaken.asc and the HRRR crops beside this
# file; tools/hrrr_outer.py case case.yaml writes the chain hrrr_raw -> parent -> nest and its run.sh.
case:
  name: day20
  description: AWAKEN area, Oklahoma; HRRR outer level, nest 25 km square with 125 m cells
domain:
  center_lat_lon: [36.362, -97.405]
  half_width: 12500.
  top: 3042.44
terrain:
  file: awaken.asc
  smoothing: btf
mesh:
  cell_size: 125.
  layers: 42
  first_layer: 10.
  stretch_ratio: 1.08
surface:
  roughness: 0.09
solver:
  max_iterations: 4000
run:
  ranks: 4
hrrr:
  file: awaken_2023051019_f01.npz
